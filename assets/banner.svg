<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="aws-snapshot-cleanup: nightly EBS backups that can only delete what they created">
  <defs>
    <radialGradient id="glow" cx="18%" cy="-10%" r="75%">
      <stop offset="0" stop-color="#ff2e3c" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#ff2e3c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ff2e3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="110%" r="55%">
      <stop offset="0" stop-color="#b3121f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b3121f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#ffd9dc"/>
      <stop offset="1" stop-color="#ff5a64"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',Consolas,Menlo,monospace}
      .sans{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .pulse{animation:p 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes p{0%{opacity:.9;transform:scale(1)}70%{opacity:0;transform:scale(3.2)}100%{opacity:0}}
      .x{animation:fade 3.2s ease-in-out infinite}
      @keyframes fade{0%,35%{opacity:1}55%,80%{opacity:.25}100%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse,.x{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="380" rx="18" fill="#0b0708"/>
  <rect width="1280" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glow2)"/>
  <rect x=".5" y=".5" width="1279" height="379" rx="17.5" fill="none" stroke="#ff2e3c" stroke-opacity=".28"/>

  <!-- left: text -->
  <g transform="translate(64 0)">
    <g transform="translate(0 72)">
      <circle cx="6" cy="-5" r="5" fill="#ff2e3c" class="pulse"/>
      <circle cx="6" cy="-5" r="5" fill="#ff2e3c"/>
      <text x="22" y="0" class="mono" font-size="15" letter-spacing="3" fill="#ff6b73">PROJECT 02 · AWS · RUNNING NIGHTLY</text>
    </g>
    <text x="-3" y="150" class="sans" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#title)">aws-snapshot-cleanup</text>
    <text x="0" y="196" class="sans" font-size="24" fill="#d9c9cb">Nightly EBS backups that can only delete</text>
    <text x="0" y="228" class="sans" font-size="24" fill="#d9c9cb">what they created —
      <tspan fill="#ff5a64" font-weight="700">enforced twice.</tspan></text>

    <g transform="translate(0 280)" class="mono" font-size="14">
      <g>
        <rect width="92" height="34" rx="17" fill="#ff2e3c" fill-opacity=".1" stroke="#ff2e3c" stroke-opacity=".45"/>
        <text x="46" y="22" text-anchor="middle" fill="#ffb3b8">Lambda</text>
      </g>
      <g transform="translate(104 0)">
        <rect width="134" height="34" rx="17" fill="#ff2e3c" fill-opacity=".1" stroke="#ff2e3c" stroke-opacity=".45"/>
        <text x="67" y="22" text-anchor="middle" fill="#ffb3b8">EventBridge</text>
      </g>
      <g transform="translate(250 0)">
        <rect width="64" height="34" rx="17" fill="#ff2e3c" fill-opacity=".1" stroke="#ff2e3c" stroke-opacity=".45"/>
        <text x="32" y="22" text-anchor="middle" fill="#ffb3b8">EBS</text>
      </g>
      <g transform="translate(326 0)">
        <rect width="64" height="34" rx="17" fill="#ff2e3c" fill-opacity=".1" stroke="#ff2e3c" stroke-opacity=".45"/>
        <text x="32" y="22" text-anchor="middle" fill="#ffb3b8">IAM</text>
      </g>
      <g transform="translate(402 0)">
        <rect width="118" height="34" rx="17" fill="#ff2e3c" fill-opacity=".1" stroke="#ff2e3c" stroke-opacity=".45"/>
        <text x="59" y="22" text-anchor="middle" fill="#ffb3b8">Python 3.12</text>
      </g>
    </g>
  </g>

  <!-- right: snapshot stack -->
  <g transform="translate(860 70)" class="mono">
    <text x="0" y="0" font-size="13" letter-spacing="2.5" fill="#9a8589">RETENTION_DAYS=0 · ALL EXPIRED</text>

    <g transform="translate(0 22)">
      <rect width="356" height="64" rx="10" fill="#150d0f" stroke="#2a171b"/>
      <rect width="4" height="64" rx="2" fill="#3ddc84"/>
      <text x="22" y="27" font-size="15" fill="#f3eded">snap-0d5a…a074</text>
      <text x="22" y="48" font-size="12" fill="#9a8589">AMI · not tagged</text>
      <text x="336" y="38" font-size="13" font-weight="700" text-anchor="end" fill="#3ddc84">KEPT</text>
    </g>

    <g transform="translate(0 98)">
      <rect width="356" height="64" rx="10" fill="#150d0f" stroke="#2a171b"/>
      <rect width="4" height="64" rx="2" fill="#3ddc84"/>
      <text x="22" y="27" font-size="15" fill="#f3eded">snap-0a67…4a91</text>
      <text x="22" y="48" font-size="12" fill="#9a8589">manual · not tagged</text>
      <text x="336" y="38" font-size="13" font-weight="700" text-anchor="end" fill="#3ddc84">KEPT</text>
    </g>

    <g transform="translate(0 174)" class="x">
      <rect width="356" height="64" rx="10" fill="#2a0b10" stroke="#ff2e3c" stroke-opacity=".7"/>
      <rect width="4" height="64" rx="2" fill="#ff2e3c"/>
      <text x="22" y="27" font-size="15" fill="#ffd9dc" text-decoration="line-through">snap-07de…d922</text>
      <text x="22" y="48" font-size="12" fill="#ff8a91">ManagedBy=aws-snapshot-cleanup</text>
      <text x="336" y="38" font-size="13" font-weight="700" text-anchor="end" fill="#ff2e3c">DELETED</text>
    </g>
  </g>
</svg>
